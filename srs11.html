<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Canlı Yayın - SiriusPro</title>
</head>
<body>
  <h2>Canlı Yayın</h2>
  <video id="video" controls width="640" height="360" autoplay></video>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script>
    var video = document.getElementById('video');
    if (Hls.isSupported()) {
      var hls = new Hls();
      hls.loadSource('https://raw.githubusercontent.com/Elvin4K/restream/refs/heads/pro4k/siriuspro.m3u8');
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, function () {
        video.play();
      });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = 'https://raw.githubusercontent.com/Elvin4K/restream/refs/heads/pro4k/siriuspro.m3u8';
      video.addEventListener('loadedmetadata', function () {
        video.play();
      });
    }
  </script>
</body>
</html>
